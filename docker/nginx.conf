log_format solvet_private '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    access_log /var/log/nginx/access.log solvet_private;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* ^/(backups|deploy|vendor|storage|docker|tests|resources|bootstrap|config)(/|$) { return 404; }
    location ~* \.(env|sql|dump|bak|log|git)$ { return 404; }
}
